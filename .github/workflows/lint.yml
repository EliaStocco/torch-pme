name: Lint

on:
  push:        # Run on *any* push to any branch
    branches: ['**']
  pull_request:  # Run on *any* pull request
    branches: ['**']


jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - run: python -m pip install tox
    - name: Lint the code
      run: tox -e lint
